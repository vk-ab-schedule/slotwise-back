spring:
  application:
    name: slotwise-back
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: slotwise
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: slotwise
    schemas: slotwise
  session:
    jdbc:
      # Tables are created by the Flyway migration V6.
      initialize-schema: never
      table-name: slotwise.spring_session

server:
  # Behind the stand proxy: trust X-Forwarded-Proto, so cookies get Secure over HTTPS.
  forward-headers-strategy: native
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax
